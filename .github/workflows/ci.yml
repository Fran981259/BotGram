name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  # Disparo manual: permite gerar evidência de gate sobre um commit já
  # publicado em `main`, que o gatilho de pull_request não alcançaria.
  workflow_dispatch:

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
    - name: Run Ruff
      run: ruff check app/ tests/
    - name: Run Mypy
      run: mypy app/

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt
    - name: Run tests
      run: |
        pytest tests/unit

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint
    - name: Build
      working-directory: ./frontend
      run: npm run build
  # Gate "Contrato Swarm": Compose e stack dedicados renderizados com imagens
  # por SHA. Roda no runner, que já tem Docker — a máquina de desenvolvimento
  # não precisa instalar daemon nenhum.
  stack-contract:
    name: Contrato Swarm (gate)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Renderizar exige TODA variável marcada como `:?` nos arquivos. O Compose
    # exige 8; a stack exige as mesmas 8 mais as duas de imagem.
    #
    # Os valores de senha e chave são PLACEHOLDERS propositais. O gate valida a
    # forma do contrato, não o ambiente: nenhum segredo real entra no CI, e a
    # asserção do último passo confere isso.
    - name: Fornecer variáveis exigidas (imagens por SHA + placeholders)
      run: |
        SHA="${GITHUB_SHA}"
        {
          echo "BACKEND_IMAGE=ghcr.io/fran981259/portal-cerrado-backend:$SHA"
          echo "FRONTEND_IMAGE=ghcr.io/fran981259/portal-cerrado-frontend:$SHA"
          echo "POSTGRES_USER=gate_placeholder"
          echo "POSTGRES_PASSWORD=gate_placeholder"
          echo "REDIS_PASSWORD=gate_placeholder"
          echo "FLOWER_USER=gate_placeholder"
          echo "FLOWER_PASSWORD=gate_placeholder"
          echo "PUBLISH_API_KEY=gate_placeholder"
          echo "NEXT_PUBLIC_SITE_URL=https://example.invalid"
          echo "CORS_ALLOWED_ORIGINS=https://example.invalid"
        } >> "$GITHUB_ENV"

    # `docker compose config` renderiza sem subir container: valida sintaxe,
    # interpolação e diretivas. `docker stack config` faz o mesmo para a stack.
    - name: Renderizar Compose com imagens por SHA
      run: docker compose -f docker-compose.yml config > /tmp/compose.rendered.yml

    - name: Renderizar stack Swarm
      run: docker stack config -c docker-stack.swarm.yml > /tmp/swarm.rendered.yml

    # Sem esta etapa o gate provaria apenas que o YAML não quebra. As
    # asserções abaixo é que transformam "renderizou" em "está correto".
    - name: Verificar o contrato renderizado
      run: |
        set -euo pipefail
        fail=0

        for rendered in /tmp/compose.rendered.yml /tmp/swarm.rendered.yml; do
          name="$(basename "$rendered")"

          # Toda imagem da aplicação tem de estar presa ao SHA do commit.
          if grep -oE 'image: *[^ ]+' "$rendered" \
             | grep -E 'portal-cerrado-(backend|frontend)' \
             | grep -v ":${GITHUB_SHA}$"; then
            echo "::error title=Imagem não fixada por SHA ($name)::imagem da aplicação sem o SHA do commit"
            fail=1
          else
            echo "OK  $name: imagens da aplicação fixadas em $GITHUB_SHA"
          fi

          # `:latest` é proibido em qualquer imagem renderizada.
          if grep -oE 'image: *[^ ]+' "$rendered" | grep -q ':latest'; then
            echo "::error title=Tag latest em $name::imagem mutável impede rollback determinístico"
            fail=1
          else
            echo "OK  $name: nenhuma tag :latest"
          fi

          # Compose e stack precisam descrever exatamente os mesmos serviços.
          services="$(grep -cE '^  [a-z_]+:$' "$rendered" || true)"
          echo "OK  $name: $services serviço(s)"
        done

        compose_services="$(grep -oE '^  [a-z_]+:$' /tmp/compose.rendered.yml | sort -u)"
        swarm_services="$(grep -oE '^  [a-z_]+:$' /tmp/swarm.rendered.yml | sort -u)"
        if [ "$compose_services" != "$swarm_services" ]; then
          echo "::error title=Runtimes divergentes::Compose e Swarm descrevem serviços diferentes"
          diff <(echo "$compose_services") <(echo "$swarm_services") || true
          fail=1
        else
          echo "OK  Compose e Swarm descrevem o mesmo conjunto de serviços"
        fi

        # Prova de que nenhum segredo real entrou no gate: cada segredo OBRIGATÓRIO
        # tem de ser substituído pelo placeholder em todo lugar onde aparece.
        #
        # A verificação é booleana de propósito. REDIS_PASSWORD e FLOWER_PASSWORD
        # não aparecem como `CHAVE: valor` — são embutidos em REDIS_URL e em
        # `--basic-auth`. Uma checagem posicional pegaria a linha errada e daria
        # falso negativo.
        for key in POSTGRES_PASSWORD REDIS_PASSWORD FLOWER_PASSWORD PUBLISH_API_KEY; do
          if grep -q '\${'"$key"':?' /tmp/compose.rendered.yml; then
            echo "::error title=Segredo no gate::$key permaneceu como variável não resolvida"
            fail=1
          else
            echo "OK  $key interpolado com placeholder, nenhum segredo real no gate"
          fi
        done

        [ "$fail" -eq 0 ] || exit 1
        echo "Contrato Swarm validado com imagens por SHA."
