x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15
    container_name: portal_cerrado_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: portal_cerrado
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      portal_cerrado_net:
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER obrigatorio} -d portal_cerrado"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portal_cerrado_redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}
    networks:
      portal_cerrado_net:
        aliases: [redis]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal_cerrado:
    image: ${BACKEND_IMAGE:-ghcr.io/fran981259/portal-cerrado-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_cerrado_app
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER obrigatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}@postgres:5432/portal_cerrado
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_FALLBACK_CHAIN: ${LLM_FALLBACK_CHAIN:-gemini,groq,openai}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-1.5-lite-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatorio}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatorio}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://portal_cerrado:8000}
      CELERY_SCHEDULER: "1"
      PUBLISH_API_KEY: ${PUBLISH_API_KEY:?PUBLISH_API_KEY obrigatorio}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS obrigatorio}
      TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:-127.0.0.1,::1}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.35}
      DATABASE_CONNECT_RETRIES: ${DATABASE_CONNECT_RETRIES:-10}
      DATABASE_CONNECT_RETRY_DELAY: ${DATABASE_CONNECT_RETRY_DELAY:-1}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      portal_cerrado_net:
        aliases: [portal_cerrado, portal-cerrado-api]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_worker:
    image: ${BACKEND_IMAGE:-ghcr.io/fran981259/portal-cerrado-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_cerrado_worker
    restart: unless-stopped
    logging: *default-logging
    command: celery -A app.celery_app worker -c 1 -l info
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER obrigatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}@postgres:5432/portal_cerrado
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_FALLBACK_CHAIN: ${LLM_FALLBACK_CHAIN:-gemini,groq,openai}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatorio}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatorio}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.35}
      DATABASE_CONNECT_RETRIES: ${DATABASE_CONNECT_RETRIES:-10}
      DATABASE_CONNECT_RETRY_DELAY: ${DATABASE_CONNECT_RETRY_DELAY:-1}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      portal_cerrado:
        condition: service_healthy
    networks:
      - portal_cerrado_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery_beat:
    image: ${BACKEND_IMAGE:-ghcr.io/fran981259/portal-cerrado-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_cerrado_beat
    restart: unless-stopped
    logging: *default-logging
    command: celery -A app.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER obrigatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}@postgres:5432/portal_cerrado
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_FALLBACK_CHAIN: ${LLM_FALLBACK_CHAIN:-gemini,groq,openai}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatorio}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatorio}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.35}
      DATABASE_CONNECT_RETRIES: ${DATABASE_CONNECT_RETRIES:-10}
      DATABASE_CONNECT_RETRY_DELAY: ${DATABASE_CONNECT_RETRY_DELAY:-1}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portal_cerrado_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery_monitoring:
    image: ${BACKEND_IMAGE:-ghcr.io/fran981259/portal-cerrado-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_cerrado_monitoring
    restart: unless-stopped
    logging: *default-logging
    command: celery -A app.celery_app worker -Q monitoring -c 1 -l info
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER obrigatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}@postgres:5432/portal_cerrado
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_CONNECT_RETRIES: ${DATABASE_CONNECT_RETRIES:-10}
      DATABASE_CONNECT_RETRY_DELAY: ${DATABASE_CONNECT_RETRY_DELAY:-1}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portal_cerrado_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  flower:
    image: ${BACKEND_IMAGE:-ghcr.io/fran981259/portal-cerrado-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_cerrado_flower
    restart: unless-stopped
    logging: *default-logging
    command: celery -A app.celery_app flower --port=5555 --basic-auth=${FLOWER_USER:?FLOWER_USER obrigatorio}:${FLOWER_PASSWORD:?FLOWER_PASSWORD obrigatorio}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER obrigatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}@postgres:5432/portal_cerrado
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}@redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_FALLBACK_CHAIN: ${LLM_FALLBACK_CHAIN:-gemini,groq,openai}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      celery_worker:
        condition: service_healthy
    networks:
      - portal_cerrado_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/fran981259/portal-cerrado-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://portal_cerrado:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatorio}
        NEXT_PUBLIC_MATOMO_URL: ${NEXT_PUBLIC_MATOMO_URL:-https://analytics.portalcerrado.com.br/}
        NEXT_PUBLIC_MATOMO_SITE_ID: ${NEXT_PUBLIC_MATOMO_SITE_ID:-1}
    container_name: portal_cerrado_frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://portal_cerrado:8000
      API_URL: http://portal_cerrado:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatorio}
      NEXT_PUBLIC_MATOMO_URL: ${NEXT_PUBLIC_MATOMO_URL:-https://analytics.portalcerrado.com.br/}
      NEXT_PUBLIC_MATOMO_SITE_ID: ${NEXT_PUBLIC_MATOMO_SITE_ID:-1}
    depends_on:
      portal_cerrado:
        condition: service_healthy
    networks:
      - portal_cerrado_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/robots.txt || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s

  matomo_db:
    image: mariadb:10.11
    container_name: portal_cerrado_matomo_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD:?MATOMO_DB_ROOT_PASSWORD obrigatorio}
      MYSQL_DATABASE: matomo
      MYSQL_USER: ${MATOMO_DB_USER:?MATOMO_DB_USER obrigatorio}
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD:?MATOMO_DB_PASSWORD obrigatorio}
    volumes:
      - matomo_db_data:/var/lib/mysql
    networks:
      portal_cerrado_net:
        aliases: [matomo_db]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  matomo:
    image: matomo:5
    container_name: portal_cerrado_matomo
    restart: unless-stopped
    logging: *default-logging
    environment:
      MATOMO_DATABASE_HOST: matomo_db
      MATOMO_DATABASE_DBNAME: matomo
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER:?MATOMO_DB_USER obrigatorio}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD:?MATOMO_DB_PASSWORD obrigatorio}
    volumes:
      - matomo_data:/var/www/html
    depends_on:
      matomo_db:
        condition: service_healthy
    networks:
      portal_cerrado_net:
        aliases: [matomo]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/matomo.php?module=API&method=API.getMatomoVersion&format=json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: portal_cerrado_caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - portal_cerrado_net
    depends_on:
      - frontend
      - matomo

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
  matomo_data:
  matomo_db_data:

networks:
  portal_cerrado_net:
    driver: ${DOCKER_NETWORK_DRIVER:-overlay}
    attachable: true
